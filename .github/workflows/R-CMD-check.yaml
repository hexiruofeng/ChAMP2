name: R-CMD-check

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  R-CMD-check:
    name: R ${{ matrix.r }} ( ${{ matrix.os }} )
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        r: ['4.2.3', '4.3.3', '4.4.3', '4.5.3', '4.6.1']
        include:
          - os: windows-latest
            r: '4.6.1'
          - os: macos-latest
            r: '4.6.1'
    env:
      R_KEEP_PKG_SOURCE: yes
      BIOCONDUCTOR_ONLINE: true
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::BiocManager
            any::ChAMPdata
            any::limma
            any::matrixStats
            any::illuminaio
            any::DNAcopy
            any::preprocessCore
            any::bumphunter
            any::sva
            any::globaltest
            any::GenomicRanges
            any::quadprog
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check
          dependencies: '"hard"'

      - name: Session info
        run: |
          Rscript -e 'sessionInfo()'
        shell: bash

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true

      - name: Install optional packages (best effort)
        continue-on-error: true
        shell: bash
        run: |
          Rscript -e 'if (requireNamespace("BiocManager", quietly = TRUE)) BiocManager::install(c("minfi", "DMRcate", "impute", "goseq", "missMethyl"), update = FALSE, ask = FALSE)'
